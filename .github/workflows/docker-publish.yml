name: Build and Push Images

# This workflow builds multi-arch images and pushes to Docker Hub and GHCR.
env:
  # semantic version for metadata-action if desired
  VERSION: 0.2
  # Remember to set DOCKER_USERNAME and DOCKER_PASSWORD as secrets

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "master" ]

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          # If GHCR push still fails with insufficient_scope, create a PAT with 'write:packages'
          # and replace password: ${{ secrets.GHCR_PAT }} and store the PAT as a secret.

      - name: Normalize repo name to lowercase and pick Docker username
        id: lower
        run: |
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          DOCKER_NAME=${{ secrets.DOCKER_USERNAME }}
          echo "repo_name=$REPO_NAME" >> $GITHUB_OUTPUT
          echo "docker_name=$DOCKER_NAME" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ steps.lower.outputs.docker_name }}/${{ steps.lower.outputs.repo_name }}
            ghcr.io/${{ github.repository_owner }}/${{ steps.lower.outputs.repo_name }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Show generated image tags and labels (debug)
        run: |
          echo "Generated tags:"
          echo "${{ steps.meta.outputs.tags }}"
          echo
          echo "Generated labels:"
          echo "${{ steps.meta.outputs.labels }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
